{% extends "base.html" %}
{% load i18n %}

{% block title %}Login Failure{% endblock %}

{% block content %}
<div class="container" style="padding-top: 150px; padding-bottom: 50px;">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card shadow-lg">
                <div class="card-body p-5">
                    <h1 class="card-title text-danger mb-4">Third-Party Login Failure</h1>
                    
                    <p class="lead mb-4">
                        An error occurred while attempting to log in via your third-party account.
                    </p>

                    <a href="{% url 'home' %}" class="btn btn-primary btn-lg">Return to Homepage</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
